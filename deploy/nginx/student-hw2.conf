# nginx for the Students app: two hostnames on one server.
# Replace the two server_name values if your hostnames differ (they must match FRONTEND_URL / API_URL in .env).
# Copy to /etc/nginx/sites-available/student-hw2 (Ubuntu) or /etc/nginx/conf.d/student-hw2.conf (Amazon Linux).
# Cloudflare (orange cloud) terminates HTTPS and talks to this server on port 80.

# ---------- Frontend: students-hw.dvconsulting.org -> Next.js ----------
server {
    listen 80;
    server_name students-hw.dvconsulting.org;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Next.js static files: cache for a year (file names change on every build)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3101;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
    }
}

# ---------- API: students-hw-api.dvconsulting.org -> Spring Boot ----------
server {
    listen 80;
    server_name students-hw-api.dvconsulting.org;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # /api/v1/students, /swagger-ui.html, /v3/api-docs, /actuator/health
    location / {
        proxy_pass http://127.0.0.1:8101;
        proxy_read_timeout 90s;
    }
}
