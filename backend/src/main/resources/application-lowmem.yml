# Profile "lowmem": fewer threads and connections, for a small server (EC2 + Docker).
# Use together with h2:  SPRING_PROFILES_ACTIVE=h2,lowmem
server:
  tomcat:
    threads:
      max: 20        # default 200
      min-spare: 2   # default 10
    max-connections: 200
    accept-count: 50

spring:
  datasource:
    hikari:
      maximum-pool-size: 3   # default 10; H2 in memory needs very few
      minimum-idle: 1
