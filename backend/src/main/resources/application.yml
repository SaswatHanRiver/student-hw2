# Student API configuration. Every value can be overridden with an environment variable.
server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: student-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:students}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # Flyway owns the schema (db/migration); Hibernate never changes it
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  # Comma-separated frontend origins allowed to call the API (CORS). "*" works inside a host name,
  # so https://student-hw2*.vercel.app covers the Vercel production and preview URLs.
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://student-hw2*.vercel.app}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
