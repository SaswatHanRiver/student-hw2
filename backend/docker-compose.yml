# Local PostgreSQL for development: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: students
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - student-pg-data:/var/lib/postgresql/data
volumes:
  student-pg-data:
