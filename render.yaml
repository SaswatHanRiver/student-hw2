# Render Blueprint: the Spring Boot API (Docker, from the backend folder) with an in-memory H2 database.
# Render dashboard -> New -> Blueprint -> pick this repo.
# Free plan: the service sleeps after ~15 min idle; the first request then takes about a minute,
# and the H2 data resets to the 24 seed students on every restart.
services:
  - type: web
    name: student-hw2-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: h2
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75"
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,https://student-hw2*.vercel.app"
